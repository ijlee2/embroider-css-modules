allowBuilds:
  "@percy/core": true
  "@percy/ember@https://codeload.github.com/ijlee2/percy-ember/tar.gz/e0de3dd8b2f35895eb4a00e96ca1a84a68cf86d5": true
  core-js: false
  protobufjs: false
  unrs-resolver: false

autoDedupe: true

autoInstallPeers: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAge: 720

minimumReleaseAgeExclude:
  - "@codemod-utils/*"
  - "@ijlee2-frontend-configs/*"
  - "ember-testem"

packages:
  - "configs/**"
  - "docs/**"
  - "packages/ember-codemod-remove-ember-css-modules"
  - "packages/ember-codemod-remove-global-styles"
  - "packages/embroider-css-modules"
  - "packages/type-css-modules"
  - "tests/**"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*stylelint*"

resolvePeersFromWorkspaceRoot: false

verifyDepsBeforeRun: "warn"
