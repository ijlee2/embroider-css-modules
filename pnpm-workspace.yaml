allowBuilds:
  "@percy/core": true
  "@percy/ember@https://codeload.github.com/ijlee2/percy-ember/tar.gz/5d7df0e2cd5230cc1ee0ee0ccc8ff9ea3edf1613": true
  core-js: false
  protobufjs: false
  unrs-resolver: false

autoDedupe: true

autoInstallPeers: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAge: 720

minimumReleaseAgeExclude:
  - "@codemod-utils/*"
  - "@ijlee2-frontend-configs/*"
  - "ember-testem"

overrides:
  "testem": "^4.0.0-beta.3" # Due to ember-cli

packages:
  - "configs/**"
  - "docs/**"
  - "packages/ember-codemod-remove-ember-css-modules"
  - "packages/ember-codemod-remove-global-styles"
  - "packages/embroider-css-modules"
  - "packages/type-css-modules"
  - "tests/**"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*stylelint*"

resolvePeersFromWorkspaceRoot: false

verifyDepsBeforeRun: "warn"
